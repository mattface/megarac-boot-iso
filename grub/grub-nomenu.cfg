# Config embedded in grubaa64-nomenu.efi (see build.sh). The same console setup
# as grub.cfg, but with no menu at all: GRUB runs these two commands, finds no
# menu entries, and drops straight to the grub> prompt.
#
# This pairs with needs_interrupt: false in the LAVA device type - there is no
# menu to time out and nothing to interrupt. It removes the failure mode the
# menu brought with it: if the menu expired before the harness took control,
# GRUB exited to firmware, the firmware booted whatever was next in its boot
# order, and LAVA drove that bootloader instead - silently, since the only tell
# was a second "GNU GRUB" banner in the log.
#
# Terminal: the plain EFI `console` (ConOut/ConIn), NOT `serial efi0`. On the
# ThunderX2/AMI board this targets there is no EFI Serial I/O Protocol, so
# `serial efi0` just prints "terminal `serial' isn't found" and does nothing,
# and arm64-efi GRUB has no PL011 driver to reach the SBSA UART directly. GRUB
# therefore reaches the BMC's serial-over-LAN only via the firmware console,
# which means the firmware's BIOS "Console Redirection" must be ENABLED.
terminal_input console
terminal_output console
