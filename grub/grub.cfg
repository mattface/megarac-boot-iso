# Config embedded in grubaa64.efi (see build.sh). A standalone GRUB carries this
# in its own (memdisk), so it always runs regardless of where the binary is
# loaded from - unlike a distro grubaa64.efi, which looks for $prefix/grub.cfg
# and drops to the grub> shell when it isn't found.
#
# It shows a 30s menu so the test harness can interrupt GRUB and drive the
# grub> prompt; if nobody interrupts, it exits to firmware (normal boot order).
#
# Terminal: the plain EFI `console` (ConOut/ConIn), NOT `serial efi0`. On the
# ThunderX2/AMI board this targets there is no EFI Serial I/O Protocol, so
# `serial efi0` just prints "terminal `serial' isn't found" and does nothing,
# and arm64-efi GRUB has no PL011 driver to reach the SBSA UART directly. GRUB
# therefore reaches the BMC's serial-over-LAN only via the firmware console,
# which means the firmware's BIOS "Console Redirection" must be ENABLED. (The
# OS console=ttyAMA0 reaches SOL on its own either way - only GRUB needs this.)
set timeout=30
terminal_input console
terminal_output console
menuentry "LAVA netboot: no job took control, exit to firmware" {
    exit
}
