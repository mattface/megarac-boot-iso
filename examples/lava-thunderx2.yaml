# Boot a ThunderX2 (AMI MegaRAC BMC, no usable network bootloader) off the
# prebuilt GRUB ISO in this repo. LAVA downloads the ISO into the flasher
# directory - which lives in the NFS-exported dispatcher tree - and the device
# dictionary's flasher commands attach it to that board's BMC. Because the BMC
# address comes from the device dictionary, this job works unchanged on every
# board of the device type. The device's power commands then select the virtual
# CD, and LAVA interrupts GRUB on the serial console to netboot the kernel and
# ramdisk over TFTP. Nothing on the disk is used.
device_type: thunderx2
job_name: thunderx2 netboot via megarac-boot-iso
visibility: public
timeouts:
  job:
    minutes: 30
  action:
    minutes: 10
  connection:
    minutes: 3

actions:
- deploy:
    timeout:
      minutes: 10
    to: flasher
    images:
      iso:
        url: https://raw.githubusercontent.com/mattface/megarac-boot-iso/main/grub/lava-grub.iso

# The kernel and ramdisk that actually vary per job: ordinary tftp artifacts.
- deploy:
    timeout:
      minutes: 10
    to: tftp
    kernel:
      url: https://deb.debian.org/debian/dists/bookworm/main/installer-arm64/current/images/netboot/debian-installer/arm64/linux
      type: image
    ramdisk:
      url: https://storage.kernelci.org/images/rootfs/buildroot/buildroot-baseline/20230703.0/arm64/rootfs.cpio.gz
      compression: gz
    os: oe

- boot:
    timeout:
      minutes: 15
    method: grub
    commands: ramdisk
    prompts:
    - '/ #'

- test:
    timeout:
      minutes: 5
    definitions:
    - repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: smoke
        run:
          steps:
          - uname -a
          - lava-test-case kernel-boot --result pass
      from: inline
      name: smoke
      path: inline/smoke.yaml
