# Boot a ThunderX2 (AMI MegaRAC BMC, no usable network bootloader) off a GRUB
# EFI fetched by URL. LAVA downloads the EFI, a postprocess container wraps it
# in an ISO and attaches it to the BMC as an NFS virtual CD, then the device's
# own power commands select the CD and power the board on. Nothing on the disk
# is used and nothing is pre-staged on the worker.
device_type: thunderx2
job_name: thunderx2 netboot via megarac-boot-iso
visibility: public
timeouts:
  job:
    minutes: 30
  action:
    minutes: 10
  connection:
    minutes: 3

actions:
- deploy:
    to: downloads
    images:
      grub:
        # Any aarch64 GRUB EFI. Debian's installer grub is a convenient one.
        url: https://ftp.debian.org/debian/dists/stable/main/installer-arm64/current/images/netboot/debian-installer/arm64/grubaa64.efi
    postprocess:
      docker:
        image: debian:stable-slim
        steps:
        - apt-get update && apt-get install -y mtools xorriso curl ca-certificates >/dev/null
        - curl -fsSL -o megarac-boot-iso https://raw.githubusercontent.com/mattface/megarac-boot-iso/main/megarac-boot-iso
        - chmod +x megarac-boot-iso
        # Everything is inferred: NFS server/path from LAVA_DISPATCHER_IP,
        # LAVA_JOB_ID and LAVA_DISPATCHER_PREFIX; the BMC from the device's
        # dynamic_data ($BMC_HOST); credentials default to admin/admin; the EFI
        # is the single *.efi just downloaded; the image name defaults.
        - ./megarac-boot-iso

# The kernel and ramdisk that actually vary per job: ordinary tftp artifacts.
- deploy:
    to: tftp
    kernel:
      url: https://deb.debian.org/debian/dists/bookworm/main/installer-arm64/current/images/netboot/debian-installer/arm64/linux
      type: image
    ramdisk:
      url: https://storage.kernelci.org/images/rootfs/buildroot/buildroot-baseline/20230703.0/arm64/rootfs.cpio.gz
      compression: gz
    os: oe

- boot:
    method: grub
    commands: ramdisk
    prompts:
    - '/ #'

- test:
    definitions:
    - repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: smoke
        run:
          steps:
          - uname -a
          - lava-test-case kernel-boot --result pass
      from: inline
      name: smoke
      path: inline/smoke.yaml
